name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check pull request sign-offs
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_REF: ${{ github.base_ref }}
        run: npm run dco:check -- "origin/$DCO_BASE_REF"
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
