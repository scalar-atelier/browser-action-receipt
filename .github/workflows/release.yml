name: release-candidate

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Runner subset for a focused rerun
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target_os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.target_os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on macOS and Windows
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run verify
